<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sofia AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Instrument+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #080b12;
    --bg2:       #0d1120;
    --bg3:       #111827;
    --surface:   #161d2e;
    --surface2:  #1e2840;
    --border:    rgba(255,255,255,0.07);
    --border2:   rgba(255,255,255,0.12);
    --teal:      #00d4b4;
    --teal-dim:  rgba(0,212,180,0.15);
    --teal-glow: rgba(0,212,180,0.3);
    --gold:      #f0c060;
    --gold-dim:  rgba(240,192,96,0.12);
    --text:      #e8edf5;
    --text-dim:  #8892a4;
    --text-muted:#4a5568;
    --user-bg:   linear-gradient(135deg, #0a7c6e, #00d4b4);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }

  body {
    font-family: 'Instrument Sans', sans-serif;
    background: var(--bg);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    position: relative;
    overflow: hidden;
  }

  /* AMBIENT BACKGROUND */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 10%, rgba(0,212,180,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 80%, rgba(99,102,241,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 60% 20%, rgba(240,192,96,0.04) 0%, transparent 50%);
    pointer-events: none;
  }

  /* GRID TEXTURE */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* CHAT SHELL */
  .shell {
    width: 100%;
    max-width: 460px;
    height: min(780px, calc(100dvh - 32px));
    background: var(--bg2);
    border-radius: 28px;
    border: 1px solid var(--border2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    z-index: 1;
    box-shadow:
      0 0 0 1px rgba(0,212,180,0.05),
      0 40px 120px rgba(0,0,0,0.6),
      0 0 80px rgba(0,212,180,0.04);
    animation: shellIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes shellIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* HEADER */
  .header {
    padding: 0 20px;
    height: 80px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    background: linear-gradient(180deg, rgba(0,212,180,0.04) 0%, transparent 100%);
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 20px; right: 20px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--teal-glow), transparent);
  }

  /* AVATAR */
  .avatar-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a2540, #0d1829);
    border: 1.5px solid rgba(0,212,180,0.3);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* SVG FACE */
  .avatar svg {
    width: 44px; height: 44px;
  }

  /* BREATHING GLOW RING */
  .avatar-ring {
    position: absolute; inset: -4px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--teal), transparent 60%, var(--teal));
    animation: spin 4s linear infinite;
    opacity: 0.4;
    z-index: -1;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .avatar-ring::after {
    content: '';
    position: absolute; inset: 3px;
    border-radius: 50%;
    background: var(--bg2);
  }

  .status-pip {
    position: absolute;
    bottom: 1px; right: 1px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #22c55e;
    border: 2px solid var(--bg2);
    animation: pip 2s ease-in-out infinite;
  }

  @keyframes pip {
    0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
    50% { box-shadow: 0 0 0 4px rgba(34,197,94,0); }
  }

  .header-info { flex: 1; min-width: 0; }

  .header-name {
    font-family: 'Syne', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
    display: flex; align-items: center; gap: 8px;
  }

  .header-name .verified {
    width: 16px; height: 16px;
    background: var(--teal);
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.6rem;
    color: var(--bg);
    font-weight: 800;
    flex-shrink: 0;
  }

  .header-sub {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 2px;
    display: flex; align-items: center; gap: 6px;
  }

  .live-dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #22c55e;
    animation: pip 1.5s ease-in-out infinite;
  }

  .header-actions {
    display: flex; gap: 8px;
  }

  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-dim);
    transition: all 0.2s;
    font-size: 0.85rem;
  }

  .icon-btn:hover {
    background: var(--surface2);
    color: var(--teal);
    border-color: rgba(0,212,180,0.2);
  }

  /* MESSAGES */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

  /* DATE LABEL */
  .date-label {
    text-align: center;
    margin: 12px 0 8px;
    display: flex; align-items: center; gap: 10px;
  }

  .date-label span {
    font-size: 0.68rem;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 500;
    white-space: nowrap;
  }

  .date-label::before, .date-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* MESSAGE ROW */
  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin-bottom: 2px;
  }

  .msg-row.sofia { justify-content: flex-start; }
  .msg-row.user  { justify-content: flex-end; }

  .msg-row + .msg-row.sofia,
  .msg-row + .msg-row.user { margin-top: 2px; }

  /* Group spacing */
  .msg-row.sofia.first-in-group { margin-top: 10px; }
  .msg-row.user.first-in-group  { margin-top: 10px; }

  .row-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a2540, #0d1829);
    border: 1px solid rgba(0,212,180,0.25);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-bottom: 1px;
    overflow: hidden;
  }

  .row-avatar svg { width: 26px; height: 26px; }
  .row-avatar.hidden { opacity: 0; pointer-events: none; }

  /* BUBBLE */
  .bubble-wrap { display: flex; flex-direction: column; max-width: 78%; }
  .msg-row.user .bubble-wrap { align-items: flex-end; }

  .bubble {
    padding: 11px 15px;
    font-size: 0.875rem;
    line-height: 1.6;
    position: relative;
    word-break: break-word;
    animation: bubbleIn 0.3s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg-row.sofia .bubble {
    background: var(--surface);
    color: var(--text);
    border-radius: 16px 16px 16px 4px;
    border: 1px solid var(--border);
  }

  .msg-row.sofia .bubble.last {
    border-radius: 4px 16px 16px 16px;
  }

  .msg-row.sofia .bubble.only {
    border-radius: 16px 16px 16px 4px;
  }

  .msg-row.user .bubble {
    background: linear-gradient(135deg, #0a6e62, #00b89e);
    color: #fff;
    border-radius: 16px 16px 4px 16px;
    border: 1px solid rgba(0,212,180,0.2);
    box-shadow: 0 4px 20px rgba(0,212,180,0.15);
  }

  .bubble-time {
    font-size: 0.65rem;
    color: var(--text-muted);
    margin-top: 4px;
    padding: 0 2px;
    display: flex; align-items: center; gap: 4px;
  }

  .msg-row.user .bubble-time { justify-content: flex-end; }

  /* TYPING */
  .typing-row {
    display: flex; align-items: flex-end; gap: 8px;
    margin-top: 10px;
    animation: bubbleIn 0.3s ease both;
  }

  .typing-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px 18px;
    border-radius: 16px 16px 16px 4px;
    display: flex; gap: 5px; align-items: center;
  }

  .typing-bubble span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--teal);
    animation: typingBounce 1.3s ease-in-out infinite;
    opacity: 0.5;
  }

  .typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.36s; }

  @keyframes typingBounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* QUICK REPLIES */
  .quick-replies {
    padding: 0 16px 12px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }

  .quick-btn {
    background: transparent;
    border: 1px solid rgba(0,212,180,0.25);
    color: var(--teal);
    padding: 7px 14px;
    border-radius: 50px;
    font-size: 0.78rem;
    font-family: 'Instrument Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .quick-btn:hover {
    background: var(--teal-dim);
    border-color: var(--teal);
  }

  /* FOOTER */
  .footer {
    padding: 12px 14px 16px;
    border-top: 1px solid var(--border);
    background: linear-gradient(0deg, rgba(0,212,180,0.02) 0%, transparent 100%);
    flex-shrink: 0;
  }

  .input-shell {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 16px;
    padding: 8px 8px 8px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-shell:focus-within {
    border-color: rgba(0,212,180,0.4);
    box-shadow: 0 0 0 3px rgba(0,212,180,0.06);
  }

  #msgInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Instrument Sans', sans-serif;
    font-size: 0.88rem;
    color: var(--text);
    line-height: 1.4;
    resize: none;
    min-height: 22px;
    max-height: 100px;
  }

  #msgInput::placeholder { color: var(--text-muted); }

  .input-actions {
    display: flex; gap: 6px; align-items: center;
  }

  .attach-btn {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: color 0.2s;
    font-size: 1rem;
  }

  .attach-btn:hover { color: var(--teal); }

  #sendBtn {
    width: 36px; height: 36px;
    border-radius: 12px;
    background: linear-gradient(135deg, #0a7c6e, #00d4b4);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 4px 14px rgba(0,212,180,0.25);
  }

  #sendBtn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(0,212,180,0.4);
  }

  #sendBtn:active { transform: scale(0.95); }
  #sendBtn:disabled {
    background: var(--surface2);
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }

  #sendBtn svg { width: 15px; height: 15px; fill: #fff; }

  .footer-meta {
    margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }

  .footer-meta-text {
    font-size: 0.65rem;
    color: var(--text-muted);
    letter-spacing: 0.3px;
  }

  .footer-meta-dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--text-muted);
  }

  .footer-meta-brand {
    font-size: 0.65rem;
    color: var(--teal);
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* PARTICLES */
  .particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    animation: float linear infinite;
  }

  @keyframes float {
    0%   { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.3; }
    100% { transform: translateY(-10vh) translateX(40px) scale(1); opacity: 0; }
  }
</style>
</head>
<body>

<div class="shell">

  <!-- HEADER -->
  <div class="header">
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <div class="avatar">
        <!-- SVG Female Face Avatar -->
        <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Background circle -->
          <circle cx="22" cy="22" r="22" fill="url(#avatarBg)"/>
          <!-- Hair back -->
          <ellipse cx="22" cy="14" rx="11" ry="12" fill="#1a0a2e"/>
          <!-- Neck -->
          <rect x="18.5" y="30" width="7" height="8" rx="3" fill="#e8b89a"/>
          <!-- Face -->
          <ellipse cx="22" cy="24" rx="10" ry="11" fill="#f0c8a8"/>
          <!-- Hair top/sides -->
          <path d="M11 18 Q11 8 22 8 Q33 8 33 18 Q33 12 22 10 Q11 10 11 18Z" fill="#1a0a2e"/>
          <path d="M12 22 Q10 14 22 11 Q34 14 32 22" fill="#1a0a2e"/>
          <!-- Ear left -->
          <ellipse cx="12.5" cy="24" rx="2" ry="2.5" fill="#e8b89a"/>
          <!-- Ear right -->
          <ellipse cx="31.5" cy="24" rx="2" ry="2.5" fill="#e8b89a"/>
          <!-- Eye left -->
          <ellipse cx="18" cy="22" rx="2.5" ry="2.8" fill="white"/>
          <ellipse cx="18" cy="22.3" rx="1.6" ry="1.8" fill="#2d1b6b"/>
          <ellipse cx="18" cy="22.3" rx="0.7" ry="0.8" fill="#0d0d1a"/>
          <ellipse cx="18.6" cy="21.7" rx="0.5" ry="0.5" fill="white"/>
          <!-- Eyebrow left -->
          <path d="M15.5 19.2 Q18 18.2 20.5 19.2" stroke="#2d1b1b" stroke-width="1.1" stroke-linecap="round" fill="none"/>
          <!-- Eye right -->
          <ellipse cx="26" cy="22" rx="2.5" ry="2.8" fill="white"/>
          <ellipse cx="26" cy="22.3" rx="1.6" ry="1.8" fill="#2d1b6b"/>
          <ellipse cx="26" cy="22.3" rx="0.7" ry="0.8" fill="#0d0d1a"/>
          <ellipse cx="26.6" cy="21.7" rx="0.5" ry="0.5" fill="white"/>
          <!-- Eyebrow right -->
          <path d="M23.5 19.2 Q26 18.2 28.5 19.2" stroke="#2d1b1b" stroke-width="1.1" stroke-linecap="round" fill="none"/>
          <!-- Nose -->
          <path d="M21 25.5 Q22 27 23 25.5" stroke="#c89878" stroke-width="0.9" stroke-linecap="round" fill="none"/>
          <!-- Mouth smile -->
          <path d="M18.5 28.5 Q22 31 25.5 28.5" stroke="#c06060" stroke-width="1.2" stroke-linecap="round" fill="none"/>
          <!-- Hair strands front -->
          <path d="M13 16 Q14 20 13 24" stroke="#1a0a2e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <path d="M31 16 Q30 20 31 24" stroke="#1a0a2e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <!-- Teal glow overlay -->
          <circle cx="22" cy="22" r="21" fill="none" stroke="url(#tealStroke)" stroke-width="0.5"/>
          <defs>
            <radialGradient id="avatarBg" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#1a2540"/>
              <stop offset="100%" stop-color="#0a0f1e"/>
            </radialGradient>
            <linearGradient id="tealStroke" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#00d4b4" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="status-pip"></div>
    </div>

    <div class="header-info">
      <div class="header-name">
        Sofia
        <span class="verified">✓</span>
      </div>
      <div class="header-sub">
        <span class="live-dot"></span>
        Online agora · Responde em segundos
      </div>
    </div>

    <div class="header-actions">
      <div class="icon-btn" title="Minimizar">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
          <rect y="5" width="12" height="2" rx="1"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- MESSAGES -->
  <div class="messages" id="messages">
    <div class="date-label"><span>Hoje</span></div>

    <div class="msg-row sofia first-in-group" id="welcomeRow">
      <div class="row-avatar">
        <svg viewBox="0 0 26 26" fill="none">
          <circle cx="13" cy="13" r="13" fill="#1a2540"/>
          <ellipse cx="13" cy="14" rx="6" ry="6.5" fill="#f0c8a8"/>
          <path d="M7 11 Q13 6 19 11 Q19 8 13 7 Q7 8 7 11Z" fill="#1a0a2e"/>
          <ellipse cx="10.5" cy="13" rx="1.5" ry="1.7" fill="white"/>
          <ellipse cx="10.5" cy="13.2" rx="0.9" ry="1" fill="#2d1b6b"/>
          <ellipse cx="15.5" cy="13" rx="1.5" ry="1.7" fill="white"/>
          <ellipse cx="15.5" cy="13.2" rx="0.9" ry="1" fill="#2d1b6b"/>
          <path d="M11 17 Q13 18.5 15 17" stroke="#c06060" stroke-width="0.8" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="bubble-wrap">
        <div class="bubble only">
          Olá! Seja bem-vindo 👋<br><br>
          Sou a <strong>Sofia</strong>, assistente virtual da clínica. Estou aqui para te ajudar com agendamentos, dúvidas ou informações.<br><br>
          Como posso te ajudar hoje?
        </div>
        <div class="bubble-time">agora</div>
      </div>
    </div>
  </div>

  <!-- QUICK REPLIES -->
  <div class="quick-replies" id="quickReplies">
    <button class="quick-btn" onclick="quickSend('Quero agendar uma consulta')">📅 Agendar consulta</button>
    <button class="quick-btn" onclick="quickSend('Quais especialidades vocês têm?')">🔍 Especialidades</button>
    <button class="quick-btn" onclick="quickSend('Quais são os horários de atendimento?')">🕐 Horários</button>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="input-shell">
      <textarea id="msgInput" placeholder="Digite sua mensagem..." rows="1"></textarea>
      <div class="input-actions">
        <button id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
    <div class="footer-meta">
      <span class="footer-meta-text">Assistente virtual com IA</span>
      <div class="footer-meta-dot"></div>
      <span class="footer-meta-brand">SOFIA AI · TEKVEX</span>
    </div>
  </div>

</div>

<script>
  const BACKEND = 'https://sofia-ai-production-b963.up.railway.app/chat'

  const messagesEl   = document.getElementById('messages')
  const inputEl      = document.getElementById('msgInput')
  const sendBtnEl    = document.getElementById('sendBtn')
  const quickReplies = document.getElementById('quickReplies')

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto'
    inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px'
  })

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault()
      sendMessage()
    }
  })

  function getTime() {
    return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
  }

  function miniAvatar() {
    return `<svg viewBox="0
